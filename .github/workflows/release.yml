name: Release

# A pushed tag v<version> becomes a GitHub release; its notes are the "## <version>" section of ha-addon/CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions and extract notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in ha-addon/config.yaml adapter/pyproject.toml adapter/quasar_adapter/__init__.py \
              custom_components/yandex_quasar/manifest.json; do
            grep -q "\"$version\"" "$file" || { echo "::error file=$file::version $version not found"; exit 1; }
          done
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' ha-addon/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error file=ha-addon/CHANGELOG.md::no section for $version"; exit 1; }
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
