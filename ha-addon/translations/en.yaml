configuration:
  port:
    name: Port
    description: Port for stations (ws://<host>:<port>/uni.ws) and the Home Assistant integration.
  api_token:
    name: API token
    description: Token the integration uses to connect. Leave empty to generate one (printed in the log).
  mic_gain_db:
    name: Microphone gain (dB)
    description: The station sends very quiet audio (about -45 dBFS); this gain is applied before Home Assistant STT.
  speech_threshold_db:
    name: Speech threshold (dBFS)
    description: Level after gain treated as speech; keeps the station from closing the mic after 5 s.
  spotter_tail_ms:
    name: Wake word tail (ms)
    description: Audio cut right after the wake word so its ending does not reach STT.
  glagol_accept_any:
    name: Accept foreign glagol tokens
    description: Keep other local glagol clients (e.g. the yandex_station integration) working.
  account_uid:
    name: Yandex account uid
    description: Optional, reported to the station in OAuth answers.
  debug_capture:
    name: Capture station reports
    description: Debug — save raw capability/event reports from the station to /addon_configs/<app>/captures.
  log_level:
    name: Log level
